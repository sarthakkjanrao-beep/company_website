<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="sapraLogoGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#b545ff" />
      <stop offset="35%" stop-color="#7055ff" />
      <stop offset="70%" stop-color="#2589ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="speedLineGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Speed motion lines on left -->
  <path d="M 22 108 L 78 108" stroke="url(#speedLineGrad)" stroke-width="5" stroke-linecap="round" filter="url(#logoGlow)" />
  <path d="M 10 125 L 75 125" stroke="url(#speedLineGrad)" stroke-width="5" stroke-linecap="round" filter="url(#logoGlow)" />
  <path d="M 28 142 L 72 142" stroke="url(#speedLineGrad)" stroke-width="5" stroke-linecap="round" filter="url(#logoGlow)" />

  <!-- Main S Curve -->
  <path d="M 160 52 C 160 30, 96 30, 96 72 C 96 114, 164 122, 164 162 C 164 195, 118 198, 92 198" 
        stroke="url(#sapraLogoGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#logoGlow)" />

  <!-- Arrow head pointing left at bottom of S -->
  <path d="M 102 184 L 75 198 L 102 212 Z" fill="#00f2fe" filter="url(#logoGlow)" />
</svg>
